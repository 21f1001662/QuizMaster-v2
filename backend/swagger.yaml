openapi: 3.0.3
info:
  title: QuizMaster V2
  description: >-
    **API Doc for QuizMaster is an AI-powered quiz management system that allows
    educators to generate and manage quizzes while enabling students to attempt
    quizzes, track progress, and view performance analytics. The project
    involves building a responsive web interface with automated question
    generation, real-time assessments, and interactive learning features.**
  version: 1.0.0
  contact: {}
servers:
  - url: '{{host}}'
  - url: http://localhost
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register User
      description: Register User
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Shahbaz ali
                password:
                  type: string
                  example: '123456789'
                username:
                  type: string
                  example: shahbazali42
            examples:
              Register User:
                value:
                  full_name: Shahbaz ali
                  password: '123456789'
                  username: shahbazali42
      responses:
        '201':
          description: Register User
          headers:
            Connection:
              schema:
                type: string
                example: close
            Content-Length:
              schema:
                type: string
                example: '43'
            Date:
              schema:
                type: string
                example: Tue, 18 Mar 2025 09:10:14 GMT
            Server:
              schema:
                type: string
                example: Werkzeug/3.1.3 Python/3.12.3
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
              examples:
                Register User:
                  value:
                    message: User registered successfully
