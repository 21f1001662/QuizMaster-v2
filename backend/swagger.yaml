  /api/quizzes/1/questions:
    post:
      tags:
        - Admin
        - Quiz
        - Questions
      summary: Add an MCQ question
      description: Add an MCQ question
      operationId: addAnMcqQuestion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                correct_marks:
                  type: number
                  example: 4
                incorrect_marks:
                  type: number
                  example: -1
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      is_correct:
                        type: boolean
                        example: false
                      text:
                        type: string
                        example: Paris
                  example:
                    - is_correct: false
                      text: Paris
                    - is_correct: true
                      text: New Delhi
                    - is_correct: false
                      text: Berlin
                    - is_correct: false
                      text: Madrid
                question_text:
                  type: string
                  example: What is the capital of India?
                type:
                  type: string
                  example: mcq
            examples:
              Add a numeric Question:
                value: >-
                  // {

                  //     "type": "numeric",

                  //     "question_text": "What is the value of pi (up to 2
                  decimal places)?",

                  //     "answer_lower_bound": 3.14,

                  //     "answer_upper_bound": 3.15

                  // }


                  {
                      "type": "numeric",
                      "question_text": "What is the value of gravity (m/s²)?",
                      "answer_lower_bound": 9.8,
                      "answer_upper_bound": 9.81,
                      "correct_marks": 4.0,
                      "incorrect_marks": -1
                  }
              Add an MCQ question:
