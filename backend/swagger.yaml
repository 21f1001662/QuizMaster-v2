                  correct_marks: 4
                  incorrect_marks: -1
                  options:
                    - is_correct: false
                      text: Paris
                    - is_correct: true
                      text: New Delhi
                    - is_correct: false
                      text: Berlin
                    - is_correct: false
                      text: Madrid
                  question_text: What is the capital of India?
                  type: mcq
